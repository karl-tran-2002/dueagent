<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DUE Agent - Trợ lý tư vấn tuyển sinh ngành QTNL, Trường Đại học Kinh tế - Đại học Đà Nẵng">
  <title>AI Chatbot K17</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/DUE.png">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar Overlay (Mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-branding">
        <div class="sidebar-branding-info">
          <img class="sidebar-logo" src="assets/DUE.png" alt="DUE Logo">
          <div class="sidebar-branding-text">
            <div class="sidebar-branding-title">AI Chatbot K17</div>
            <div class="sidebar-branding-subtitle">Trường Đại học Kinh tế - Đại học Đà Nẵng</div>
            <div class="sidebar-branding-department">Ngành Quản trị nhân lực</div>
          </div>
          <div class="sidebar-stats" id="stats-panel">
            <div class="sidebar-stat-item" data-tooltip="Tổng số lượng người dùng" tabindex="0">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
              <span class="stat-value" id="stat-visits">-</span>
            </div>
            <div class="sidebar-stat-item" data-tooltip="Tổng số tin nhắn đã gửi" tabindex="0">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
              <span class="stat-value" id="stat-questions">-</span>
            </div>
            <div class="sidebar-stat-item" data-tooltip="Tổng số lượt truy xuất tài liệu" tabindex="0">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <span class="stat-value" id="stat-doc-searches">-</span>
            </div>
          </div>
        </div>
        <button class="sidebar-close-btn" id="sidebar-close" aria-label="Đóng sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="sidebar-header">
        <button class="new-chat-btn" id="new-chat-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Cuộc trò chuyện mới
        </button>
      </div>

      <div class="sidebar-section-title">Lịch sử trò chuyện</div>
      <div class="sidebar-content">
        <div id="chat-list"></div>
      </div>

      <button class="sidebar-collapse-btn" id="sidebar-collapse-btn" aria-label="Thu gọn sidebar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
    </aside>

    <!-- Mobile Toggle Button (floating) -->
    <button class="mobile-toggle" id="sidebar-toggle" aria-label="Mở sidebar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <!-- Main Content -->
    <main class="main-content">

      <!-- Chat Messages -->
      <div class="chat-messages" id="chat-messages"></div>

      <!-- Chat Input -->
      <div class="chat-input-area">
        <div class="chat-input-wrapper">
          <textarea id="chat-input" placeholder="Nhập câu hỏi của bạn..." rows="1" maxlength="2000"></textarea>
          <button class="input-btn" id="send-btn" aria-label="Gửi">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
          <button class="input-btn" id="stop-btn" aria-label="Dừng" style="display:none">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="6" width="12" height="12" rx="2"/>
            </svg>
          </button>
        </div>
        <div class="input-hint">AI có thể mắc lỗi. Hãy kiểm tra lại thông tin.</div>
      </div>
    </main>
  </div>


  <!-- Scripts (thứ tự quan trọng) -->
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/app.js"></script>

  <!-- User Info Collection Modal -->
  <div class="user-info-modal-overlay" id="user-info-modal-overlay">
    <div class="user-info-modal">
      <div class="user-info-modal-header">
        <img src="assets/DUE.png" alt="DUE Logo" style="width:40px;height:40px;object-fit:contain;">
        <h3>Vui lòng nhập thông tin người dùng</h3>
      </div>
      <form id="user-info-form" autocomplete="off">
        <div class="user-info-field">
          <label for="user-info-name">Họ và tên <span class="required">*</span></label>
          <input type="text" id="user-info-name" placeholder="VD: Nguyễn Văn A" required maxlength="100">
        </div>
        <div class="user-info-field">
          <label for="user-info-dob">Ngày sinh <span class="required">*</span></label>
          <input type="text" id="user-info-dob" placeholder="VD: 08/03/2005" maxlength="10" inputmode="numeric" required>
        </div>
        <button type="submit" class="user-info-submit-btn">Bắt đầu</button>
      </form>
    </div>
  </div>

  <!-- Custom Confirm Modal -->
  <div class="confirm-modal-overlay" id="confirm-modal-overlay">
    <div class="confirm-modal">
      <div class="confirm-modal-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14"/>
        </svg>
      </div>
      <div class="confirm-modal-title" id="confirm-modal-title">Xác nhận xóa</div>
      <div class="confirm-modal-message" id="confirm-modal-message">Bạn có chắc muốn xóa?</div>
      <div class="confirm-modal-actions">
        <button class="confirm-modal-btn cancel" id="confirm-modal-cancel">Hủy</button>
        <button class="confirm-modal-btn confirm" id="confirm-modal-confirm">Xóa</button>
      </div>
    </div>
  </div>
</body>
</html>
